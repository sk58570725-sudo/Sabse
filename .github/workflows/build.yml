name: Build DDOS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        sudo rm -rf /usr/local/lib/android/sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
        sudo unzip cmdline-tools.zip -d /tmp/cmdline-tools/
        sudo cp -r /tmp/cmdline-tools/cmdline-tools/* /usr/local/lib/android/sdk/cmdline-tools/latest/
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "PATH=$PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_ENV

    - name: Accept Licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

    - name: Download Gradle Wrapper
      run: |
        wget https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar -O gradle-wrapper.jar
        mkdir -p gradle/wrapper
        mv gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleRelease
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore ddos.keystore -alias ddos -keyalg RSA -keysize 2048 -validity 10000 -storepass ddos123 -keypass ddos123 -dname "CN=DDOS, OU=DDOS, O=DDOS, L=DDOS, S=DDOS, C=US"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ddos.keystore -storepass ddos123 app/build/outputs/apk/release/app-release-unsigned.apk ddos
        zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-signed.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ddos-apk
        path: app/build/outputs/apk/release/app-release-signed.apk
